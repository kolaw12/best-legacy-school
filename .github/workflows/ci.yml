name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run lint` is intentionally not gating CI yet — the repo currently has
      # ~78 pre-existing errors (mostly eslint-plugin-react-hooks's newer
      # set-state-in-effect rule) that predate this pipeline. Re-add once that
      # backlog is cleared, otherwise CI is red from the first commit.
      - run: npm run test
      - run: npm run build
